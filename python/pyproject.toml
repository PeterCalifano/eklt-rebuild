[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eklt-rebuild"
version = "0.1.0"
description = "EKLT native bindings, bridge modules, and reusable event-vision utilities."
readme = "README.md"
requires-python = ">=3.12"
license = {file = "LICENSE"}
authors = [
  {name = "Pietro Califano"},
  {name = "Daniel Gehrig"}
]
dependencies = ["numpy>=1.26", "Pillow>=10", "matplotlib>=3.8"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
eklt-ros1-relay = "eklt_bridge.ros1_relay.node:main"
eklt-run-rosbag-bridge-demo = "eklt_bridge.rosbag_bridge_demo:main"
eklt-sequence-source = "eklt_bridge.ros2_source.node:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["eklt_rebuild*", "eklt_bridge*", "event_vision_utils*"]

[tool.setuptools.package-data]
"eklt_rebuild" = ["*.so", "*.so.*", "*.pyd", "*.dll", "*.dylib", "*.pyi", "**/*.pyi"]
event_vision_utils = ["README.md", "recon/README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
