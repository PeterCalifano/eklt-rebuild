name: verify_eklt
run-name: Verify EKLT native and Python builds

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize FIBAR
        run: |
          git -c url."https://github.com/".insteadOf="git@github.com:" \
            submodule update --init lib/fibar_lib

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            catch2 \
            cmake \
            g++ \
            libceres-dev \
            libeigen3-dev \
            libopencv-dev

      - name: Build, test, install, and package
        run: |
          ./build_lib.sh \
            --build-dir build/ci-linux \
            --type Release \
            --define ENABLE_FETCH_CATCH2=OFF \
            --define WARNINGS_ARE_ERRORS=ON \
            --install \
            --package \
            --source-package

      - name: Verify profiling configuration
        run: |
          ./build_lib.sh \
            --build-dir build/ci-profile \
            --type RelWithDebInfo \
            --profile \
            --skip-tests

      - name: Verify static configuration
        run: |
          ./build_lib.sh \
            --build-dir build/ci-static \
            --type Release \
            --define BUILD_SHARED_LIBS=OFF \
            --define ENABLE_FETCH_CATCH2=OFF \
            --define WARNINGS_ARE_ERRORS=ON \
            --install

      - name: Verify installed consumers
        run: |
          cmake \
            -S tests/consumer \
            -B build/ci-consumer \
            -DCMAKE_PREFIX_PATH="${PWD}/build/ci-linux/install"
          cmake --build build/ci-consumer --parallel 2
          ./build/ci-consumer/eklt_rebuild_installed_consumer
          cmake \
            -S tests/consumer \
            -B build/ci-static-consumer \
            -DCMAKE_PREFIX_PATH="${PWD}/build/ci-static/install"
          cmake --build build/ci-static-consumer --parallel 2
          ./build/ci-static-consumer/eklt_rebuild_installed_consumer

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: eklt-native-packages
          path: build/ci-linux/package

  python:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python/pyproject.toml

      - name: Install source package and tests
        run: python -m pip install -e ./python pytest

      - name: Test and compile Python sources
        run: |
          python -m pytest -q python/tests
          python -m compileall -q python

  hygiene:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install structured-file parser
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          python -m pip install PyYAML

      - name: Check shell syntax and static analysis
        run: |
          find . -path "./build" -prune -o -path "./lib" -prune -o \
            -type f -name "*.sh" -print0 |
            xargs -0 -r -n1 bash -n
          find . -path "./build" -prune -o -path "./lib" -prune -o \
            -type f -name "*.sh" -print0 |
            xargs -0 -r shellcheck --severity=warning --exclude=SC1090

      - name: Reject unsafe clean targets
        run: |
          if ./build_lib.sh --build-dir .. --clean --skip-tests >clean.out 2>&1; then
            echo "Parent-directory cleanup was accepted."
            exit 1
          fi
          grep -F -- "--clean requires a named build directory" clean.out

      - name: Parse project metadata
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import xml.etree.ElementTree as ET
          import yaml

          for path in [Path("package.xml"), *Path("ros2").glob("*/package.xml")]:
              ET.parse(path)
          for path in Path(".github").rglob("*.yml"):
              with path.open(encoding="utf-8") as stream:
                  yaml.safe_load(stream)
          with Path("rpg_eklt.code-workspace").open(encoding="utf-8") as stream:
              json.load(stream)
          PY

      - name: Check active removed-feature references
        run: |
          ! grep -Eini \
            "find_package\\([^)]*(ZeroMQ|OptiX)|include\\([^)]*(HandleOptiX|cmake_cuda_ptx_tools)|ENABLE_OPTIX|ENABLE_ZEROMQ" \
            CMakeLists.txt

      - name: Verify external library layout
        run: |
          test ! -e extern
          test "$(git config -f .gitmodules --get submodule.lib/fibar_lib.path)" = \
            "lib/fibar_lib"
          test "$(git config -f .gitmodules --get submodule.lib/fibar_lib.url)" = \
            "git@github.com:ros-event-camera/fibar_lib.git"

      - name: Check patch whitespace
        run: git show --check --oneline --no-renames HEAD
