name: verify_eklt_ros1
run-name: Verify EKLT with ROS 1 Noetic

on:
  push:
    branches:
      - master
    paths:
      - "CMakeLists.txt"
      - "build_ros1.sh"
      - "cmake/**"
      - "config/**"
      - "dependencies.yaml"
      - "launch/**"
      - "lib/fibar_lib"
      - "package.xml"
      - "ros1/**"
      - "src/**"
      - "tests/**"
      - ".github/workflows/build_ros1.yml"
  pull_request:
    branches:
      - master
    paths:
      - "CMakeLists.txt"
      - "build_ros1.sh"
      - "cmake/**"
      - "config/**"
      - "dependencies.yaml"
      - "launch/**"
      - "lib/fibar_lib"
      - "package.xml"
      - "ros1/**"
      - "src/**"
      - "tests/**"
      - ".github/workflows/build_ros1.yml"

jobs:
  build:
    runs-on: ubuntu-24.04
    container: ros:noetic-ros-base-focal
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize FIBAR
        shell: bash
        run: |
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"
          git -c 'url.https://github.com/.insteadOf=git@github.com:' \
            submodule update --init lib/fibar_lib

      - name: Install build tools
        shell: bash
        run: |
          apt-get update
          apt-get install -y \
            git \
            libceres-dev \
            libeigen3-dev \
            libgflags-dev \
            libgoogle-glog-dev \
            libopencv-dev \
            python3-catkin-tools \
            python3-pip \
            python3-vcstool \
            ros-noetic-camera-info-manager \
            ros-noetic-image-geometry \
            ros-noetic-image-view
          # FIBAR target properties and Catch2 v3 discovery require a newer
          # CMake than Ubuntu Focal's 3.16 package.
          python3 -m pip install --no-cache-dir cmake==3.27.9

      - name: Build ROS 1 package
        shell: bash
        run: |
          ./build_ros1.sh \
            --workspace "${RUNNER_TEMP}/eklt_catkin_ws" \
            --ros-distro noetic \
            --import-dependencies \
            --jobs 2

      - name: Run ROS 1 regression tests
        shell: bash
        run: |
          ctest \
            --test-dir "${RUNNER_TEMP}/eklt_catkin_ws/build/eklt_rebuild" \
            --output-on-failure
